<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="description" content="AURORA 2026 — an immersive college fest experience." />
  <title>AURORA 2026 | College Fest</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>
  <div class="loader" id="loading-screen">
    <div class="loader-inner">
      <!-- <div class="loader-mark">AURORA<b>’26</b></div> -->
       <img src="./public/img/semaphore_logo.png" alt="" style="width: 500px;height: 500px;">
      <p id="loader-status">LOADING THE DIVE · 0%</p><button id="enter-experience" disabled>ENTER EXPERIENCE</button>
    </div>
  </div>
  <canvas id="three"></canvas>
  <div id="event-markers" aria-label="Event locations"></div>
  <aside class="event-panel" id="event-panel" aria-hidden="true" aria-label="Event information"><button
      class="panel-close" type="button" data-close-event aria-label="Close event information">×</button>
    <div id="event-panel-content"></div>
  </aside>
  <header class="topbar">
    <div class="brand">AURORA<b>’26</b></div>
    <div class="meta">14—16 FEB · RIVERDALE COLLEGE · BENGALURU</div><button class="sound" id="audio-toggle"><span
        id="audio-label">SOUND OFF</span></button>
  </header>
  <div class="experience-copy" aria-hidden="true"><span class="eyebrow">Riverdale College presents</span>
    <h1>DIVE INTO<br />AURORA.</h1>
    <p>Scroll to travel. Follow the illuminated markers to discover the fest.</p>
  </div>
  <main class="scroll-track" aria-label="AURORA scroll journey">
    <div class="scroll-space" id="register"></div>
  </main>
  <div class="hud">NOW EXPLORING / <b id="current-chapter">DIVE</b> · <span id="event-status">FOLLOW THE MARKERS</span>
  </div>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
