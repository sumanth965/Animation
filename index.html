<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="description" content="Semaphore 2026 — an immersive college fest experience at NMAMIT, Nitte–Karkala." />
  <title>Semaphore 2026 | NMAMIT Nitte–Karkala</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>
  <div class="loader" id="loading-screen">
    <div class="loader-inner">
      <!-- <div class="loader-mark">SEMAPHORE<b>’26</b></div> -->
       <img src="/img/semaphore_logo.png" alt="Semaphore Logo" style="width: 500px;height: 500px;">
      <p id="loader-status">LOADING THE DIVE · 0%</p><button id="enter-experience" disabled>ENTER EXPERIENCE</button>
    </div>
  </div>
  <canvas id="three"></canvas>
  <div id="event-markers" aria-label="Event locations"></div>
  <aside class="event-panel" id="event-panel" aria-hidden="true" aria-label="Event information"><button
      class="panel-close" type="button" data-close-event aria-label="Close event information">×</button>
    <div id="event-panel-content"></div>
  </aside>
  <header class="topbar">
    <div class="brand">SEMAPHORE<b>’26</b></div>
    <div class="meta">14—16 FEB · NMAMIT · NITTE–KARKALA</div><button class="sound" id="audio-toggle"><span
        id="audio-label">SOUND OFF</span></button>
  </header>
  <div class="experience-copy" aria-hidden="true"><span class="eyebrow">NMAM Institute of Technology · Submerged Campus Exhibition</span>
    <h1>DIVE INTO<br />SEMAPHORE.</h1>
    <p>Scroll to descend. Follow the bioluminescent markers to explore the city.</p>
  </div>
  <main class="scroll-track" aria-label="Semaphore scroll journey">
    <div class="scroll-space" id="register"></div>
  </main>
  <div class="hud">
    <div class="telemetry">DEPTH: <span id="telemetry-depth">0m</span> &nbsp;·&nbsp; STATUS: <span id="telemetry-status">STABLE</span></div>
    NOW EXPLORING / <b id="current-chapter">DIVE</b> · <span id="event-status">FOLLOW THE MARKERS</span>
  </div>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
